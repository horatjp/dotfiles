# herdr-agent-usage(usagebar)プラグインの設定。install.sh が
# ~/.config/herdr/plugins/config/usagebar/config.toml へリンクする(プラグインは無いときだけ作り、既存は書き換えない)。
# 項目の一覧は `herdr plugin config-dir usagebar` の先の、プラグインが作る既定ファイルを参照

[notify]
enabled = true
# 残りがこの % を切ったら通知する(時間枠ごとに1回ずつ)
remaining_thresholds = [50, 20, 10, 5]

[ui]
limit_percent = "remaining"
# プロンプトキャッシュの表示と「キャッシュが低い」警告を止める。契約プランでは見て変えることがない
cache_display = false
