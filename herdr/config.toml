onboarding = false

[ui]
# 状態を色だけでなく形(× ◐ ✓ ○ ·)でも見分ける(既定は dots)
status_indicators = "symbols"
# ペインの間の余白をなくし、右に何体も並べたときに文字の入る幅を増やす(区切り線は隣どうしで共有する)。
# 外枠(pane_outer_borders)は残す。外すと上端のペインの枠が消え、そこに出るペイン名がタブの行に接して見えなくなる
pane_gaps = false

# 既定の通知音が大きいため差し替え(herdr には音量設定がない)。
# 公開リポジトリのため、どちらも ffmpeg の正弦波で自作した音(0.3 秒の指数減衰を1音とする)。
#   done.mp3   : E5(659Hz) 1音
#     ffmpeg -f lavfi -i "sine=f=659:d=0.3" -af "volume='exp(-14*t)':eval=frame,afade=t=in:d=0.005,volume=6dB" -ar 44100 -ac 1 -b:a 96k done.mp3
#   request.mp3: B4(494Hz)→E5(659Hz) の上がる2音(2音目を 160ms 遅らせて重ねる)
#     ffmpeg -f lavfi -i "sine=f=494:d=0.3" -f lavfi -i "sine=f=659:d=0.3" -filter_complex "[0]volume='exp(-14*t)':eval=frame,afade=t=in:d=0.005[a];[1]volume='exp(-14*t)':eval=frame,afade=t=in:d=0.005,adelay=160[b];[a][b]amix=inputs=2:normalize=0,volume=6dB" -ar 44100 -ac 1 -b:a 96k request.mp3
[ui.sound]
done_path = "sounds/done.mp3"       # 完了時
request_path = "sounds/request.mp3" # 確認を求めるとき

# herdr-file-viewer プラグイン (https://github.com/smarzban/herdr-file-viewer)
[[keys.command]]
key = "prefix+f"
type = "shell"
command = "herdr plugin action invoke open-file-viewer --plugin herdr-file-viewer"

[[keys.command]]
key = "prefix+shift+f"
type = "shell"
command = "herdr plugin action invoke open-file-viewer-tab --plugin herdr-file-viewer"

# herdr-agent-usage プラグイン (https://github.com/senna-lang/herdr-agent-usage)
# サイドバーに文脈の使用率($context)と利用上限の残り($limit)を出す。
# `usagebar setup` の推奨から変えた点:
# - プロンプトキャッシュの行($cache_*)を外した(契約プランでは見て変えることがない)
# - 1行目は $title でなく workspace(ワークスペース名)とエージェントの種類にした。$title は「ワークスペース名・ペイン名」をつなぎ、
#   agmsg がペイン名を「<チーム>:<名前>」にするため「dotfiles・dotfiles:dotfiles-cc」と長くなる。
#   pane(ペイン名)だと名前の無いペインが状態アイコンだけになる。
# - エージェントの種類は agent でなく $provider(claude・codex など)で出す。agent は herdr の agent 名を優先して表示し、
#   agmsg は参加したペインに内部キー(a + SHA-256 の先頭24桁)を agent 名として付けるため、16進の文字列が見えてしまう。
#   $provider はプラグインが報告する値で、従量課金のペインでは課金先(openrouter など)になる
[ui.sidebar.agents]
row_gap = 0
# 上限($limit)はアカウントごとの値で、エージェントごとに1行使うと同じ数字が並ぶため、文脈の行に寄せる。
# 既定の幅(26列)で「⛁ 24% (242k) · 5h 88%」がほぼ収まる。文脈が長い表記になると $limit の末尾が切れうる。
# $provider(claude・codex などの枠の名前)はこの行だと幅に収まらないため1行目に置く。どの枠の上限かは1行目で分かる
# 色: ワークスペース名とエージェントは少し灰色がかった白、文脈と上限は目立たせないよう、さらに暗くしたくすんだ緑と黄
rows = [
  ["state_icon", { token = "workspace", fg = "#c8ccd4", bold = true }, { token = "$provider", fg = "#c8ccd4" }],
  [{ token = "$context", fg = "#4b5c44" }, { token = "$limit", fg = "#766f53" }],
]

# ワークスペース一覧を1件1行にする(既定は2行目にブランチと Git の状態)。15 前後あるので縦の長さを優先する
[ui.sidebar.spaces]
# 空行を入れると間延びするので、名前を太字にして区切りを見やすくする(色は agents の1行目と同じ)
rows = [["state_icon", { token = "workspace", fg = "#c8ccd4", bold = true }]]

# 利用上限が近づいた通知に必要(既定は off)。他の herdr 通知も画面内に出るようになる
[ui.toast]
delivery = "herdr"

[ui.toast.herdr]
position = "bottom-left"

# 推奨の ctrl+shift+u は WezTerm の文字選択と衝突するため prefix 側に置く
[[keys.command]]
key = "prefix+u"
type = "plugin_action"
command = "usagebar.open-limits"
description = "Agent Usage: open limits pane"

[[keys.command]]
key = "prefix+shift+u"
type = "plugin_action"
command = "usagebar.refresh"
description = "Agent Usage: refresh sidebar meters"
