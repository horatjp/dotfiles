onboarding = false

# 既定の通知音が大きいため差し替え(herdr には音量設定がない)。
# 公開リポジトリのため、どちらも ffmpeg の正弦波で自作した音(0.3 秒の指数減衰を1音とする)。
#   done.mp3   : E5(659Hz) 1音
#     ffmpeg -f lavfi -i "sine=f=659:d=0.3" -af "volume='exp(-14*t)':eval=frame,afade=t=in:d=0.005,volume=6dB" -ar 44100 -ac 1 -b:a 96k done.mp3
#   request.mp3: B4(494Hz)→E5(659Hz) の上がる2音(2音目を 160ms 遅らせて重ねる)
#     ffmpeg -f lavfi -i "sine=f=494:d=0.3" -f lavfi -i "sine=f=659:d=0.3" -filter_complex "[0]volume='exp(-14*t)':eval=frame,afade=t=in:d=0.005[a];[1]volume='exp(-14*t)':eval=frame,afade=t=in:d=0.005,adelay=160[b];[a][b]amix=inputs=2:normalize=0,volume=6dB" -ar 44100 -ac 1 -b:a 96k request.mp3
[ui.sound]
done_path = "sounds/done.mp3"       # 完了時
request_path = "sounds/request.mp3" # 確認を求めるとき

# herdr-file-viewer プラグイン (https://github.com/smarzban/herdr-file-viewer)
[[keys.command]]
key = "prefix+f"
type = "shell"
command = "herdr plugin action invoke open-file-viewer --plugin herdr-file-viewer"

[[keys.command]]
key = "prefix+shift+f"
type = "shell"
command = "herdr plugin action invoke open-file-viewer-tab --plugin herdr-file-viewer"

# herdr-agent-usage プラグイン (https://github.com/senna-lang/herdr-agent-usage)
# サイドバーに文脈の使用率($context)と利用上限の残り($limit)を出す。
# 行は `usagebar setup` の推奨に、複数ワークスペースを見分けるため workspace を足したもの。
# 推奨にあるプロンプトキャッシュの行($cache_*)は、契約プランでは見て変えることがないので外した
[ui.sidebar.agents]
row_gap = 0
rows = [
  ["state_icon", "workspace", "$title"],
  ["$provider", "$limit"],
  ["$context"],
]

# 利用上限が近づいた通知に必要(既定は off)。他の herdr 通知も画面内に出るようになる
[ui.toast]
delivery = "herdr"

[ui.toast.herdr]
position = "bottom-left"

# 推奨の ctrl+shift+u は WezTerm の文字選択と衝突するため prefix 側に置く
[[keys.command]]
key = "prefix+u"
type = "plugin_action"
command = "usagebar.open-limits"
description = "Agent Usage: open limits pane"

[[keys.command]]
key = "prefix+shift+u"
type = "plugin_action"
command = "usagebar.refresh"
description = "Agent Usage: refresh sidebar meters"
