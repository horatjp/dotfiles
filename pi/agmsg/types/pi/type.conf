# agmsg agent-type manifest — read-only key=value DATA. NEVER sourced.
# Pi (earendil-works/pi) 用の外部プラグイン。agmsg 1.5 は Pi を種類として持たないため dotfiles で足す。
# pi/agmsg/install.sh が ~/.agents/skills/agmsg/plugins/types/pi にリンクして信頼済みにする。
name=pi
template=template.md
cli=pi
spawnable=yes
# Pi はスキルを /skill:<name> で呼ぶ
cmd_prefix=/skill:
model_arg=--model
# Pi は bash ツールの子プロセスに PI_CODING_AGENT=true と PI_SESSION_ID を渡す
detect=PI_CODING_AGENT
session_env=PI_SESSION_ID
detect_proc=pi
spawn_unset_env=PI_CODING_AGENT PI_SESSION_ID PI_SESSION_FILE
# 中身は使わず、monitor の目印としてだけ置く。Pi の拡張 agmsg.ts がこれを見て watch.sh を常駐させる
hooks_file=.pi/agmsg-delivery
# 起動時に読み込み完了を知らせる仕組みはないので、spawn は待たない
readiness_sentinel=no
# Pi にはターンの終わりに外部コマンドを挟む hook がないため turn は持たない
delivery_modes=monitor off
