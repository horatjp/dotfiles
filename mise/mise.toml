# mise configuration file
# https://mise.jdx.dev/configuration.html

[tools]
# Node.js
# 26 系(LTS "Lithium")に固定する。"lts" は mise が 24 系(Krypton)と解決するため。
# 版を変えると install.sh の npm install -g で入れた CLI(codex・pi・cf など)が消えるので、入れ直す
node = "26"

# pnpm（プロジェクト側で使う用。install.sh のグローバル CLI は npm のまま）
pnpm = "latest"

# Bun runtime
bun = "latest"

# Python
python = "latest"

# Go
go = "latest"

# Java
# ベンダー未指定の既定は openjdk(参照実装)で、21 系は 21.0.2(2024-01)で更新が止まるため
# 更新が続く temurin を明示する
java = "temurin-21"

[settings]
# Enable experimental features
experimental = true

# Use legacy version files (.tool-versions, .node-version, etc.)
legacy_version_file = true
