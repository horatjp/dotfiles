# /etc/codex/config.toml へリンクされる共有設定(system 層)。
# 両マシン共通で手管理する項目だけを書く。model / projects / hooks.state / tui / マシン固有の MCP は
# Codex が書き込むユーザー層(~/.codex/config.toml、git 管理外)に任せる。
# 配列キーはユーザー層に同じキーがあると丸ごと置換されるので、片方にだけ書くこと。
# 例外として tui.status_line だけはここに書く(両マシンで同じ表示にしたい。Codex の /statusline で選び直すとユーザー層に書かれ、こちらは隠れるとみられる。保存先は未確認)。

# 確認を出さず、サンドボックスも外す(上の層で上書きされなければ、承認とサンドボックスについて
# codex --dangerously-bypass-approvals-and-sandbox を毎回付けるのと同じ。2026-11-03 に /status で「YOLO mode」を確認)。
# Claude Code の permissions.defaultMode = bypassPermissions に合わせた(両マシン)。
# ここは system 層なので、ユーザー層・プロファイル・信頼済みプロジェクト・起動時の指定(-s・-c)が勝つ。
# codex exec -s read-only で動かすと、モデルが実行するシェルのコマンドは読むだけになるが、承認は never のまま、
# MCP などシェル以外の経路は -s では制限されない(読むだけのレビューで MCP を使わせないなら依頼文で禁じる)。
# この2行を消すと、上の層か Codex の既定の動きに戻る。
approval_policy = "never"
sandbox_mode = "danger-full-access"

[features]
hooks = true

# ペインの下の行に、Claude Code の statusLine と同じ並び(モデル・フォルダ・ブランチ・文脈・利用上限の残り)で出し、末尾にスレッド名を足す(既定は model-with-reasoning・current-dir・thread-name で、上限は出ない)。
# その枠が無い・情報が取れないときは出ない(2026-10-31 は weekly だけが出て、5時間の枠は出なかった)。
# Claude Code の statusLine と違い外のスクリプトを呼べないので、残りの量での色分けはできない
[tui]
status_line = ["model-with-reasoning", "current-dir", "git-branch", "context-remaining", "five-hour-limit", "weekly-limit", "thread-name"]

# agmsg が sandbox 内から書き込む場所
[sandbox_workspace_write]
writable_roots = ["~/.agents/skills/agmsg/ext-tools", "~/.agents/skills/agmsg/db", "~/.agents/skills/agmsg/teams", "~/.agents/skills/agmsg/run"]

[mcp_servers.context7]
command = "npx"
args = [ "@upstash/context7-mcp@latest" ]

[mcp_servers.chrome-devtools]
command = "npx"
args = [ "chrome-devtools-mcp@latest", "--isolated=true", "--headless=true", "--executablePath=", "--chromeArg=--no-sandbox", "--chromeArg=--disable-setuid-sandbox", "--chromeArg=--disable-dev-shm-usage" ]

[mcp_servers.chrome-devtools.tools.new_page]
approval_mode = "approve"
